<script>

// FORMAT: "wide" (1920 × 1080) or "vertical" (1080 × 1920). ?preset=particles&format=vertical previews.

const PRESET = "all";
const FORMAT = "wide";
const STINGS = {
  solid:     { word: "光影設計", tagline: "LIGHT & SHADOW DESIGN STUDIO", colors: { bg: "#120b07", metal: "#f3c47e", rim: "#ff7a3d", ray: "#ffd9a0" } },
  particles: { word: "SLOW SIGNAL", tagline: "A podcast about building quietly", colors: { bg: "#05060d", a: "#7fe7ff", b: "#b48cff", fill: "#d9f6ff" } },
  contours:  { word: "文字世界", tagline: "THE LETTERING CHANNEL · EP 07", colors: { bg: "#10132b", line: "#ffffff" } },
};

  window.__titles = { W, H, V, order, SPAN, word: V ? { cx: 504, cy: 600, w: 760, h: 250 } : { cx: 960, cy: 470, w: 1300, h: 270 } };
  const names = { solid: "SOLID TYPE + RAYS", particles: "PARTICLES INTO TYPE", contours: "CONTOURS + GLITCH" };

  order.forEach((id, i) => {

      `<div class="a" data-sfx="riser" data-sfx-at="0.3"></div>` +
      `<div class="a flash" style="background:${id === "contours" ? "transparent" : id === "particles" ? "rgba(225,245,255,.6)" : "rgba(255,240,220,.8)"}" data-fx="flash" data-at="2.4" data-dur="0.5" data-sfx="impact"></div>` +

    order.includes("particles") && { id: "particles", at: at("particles", 0, 6) },

})();
