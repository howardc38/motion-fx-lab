<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Mercury Type</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1c120e;color:#f7f1ec;font:13px "Helvetica Neue",Arial,sans-serif}
main{width:min(100vw,1600px);margin:auto;position:relative}
#stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#b9573a}
#film{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:28px 38px;opacity:0}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:16px}
.pill{background:rgba(18,14,13,0.72);backdrop-filter:blur(8px);color:#f7f1ec;padding:7px 15px;border-radius:999px;font:700 12px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:0.06em;border:1px solid rgba(255,255,255,0.16);font-variant-numeric:tabular-nums}
nav{padding:14px 18px;display:flex;align-items:center;gap:12px;background:#241814;border-top:1px solid #3f2a22;flex-wrap:wrap}
button,select,input[type="text"]{padding:8px 13px;border:1px solid #6b4b3e;background:#160f0c;color:#f7f1ec;font:inherit;border-radius:3px}
button{cursor:pointer;font-weight:600}
button:hover{border-color:#d97757}
#scrub{flex:1;min-width:180px;accent-color:#d97757}
#time{font-variant-numeric:tabular-nums;min-width:92px;color:#d8c4b8}
label{display:flex;align-items:center;gap:7px;color:#e4d3c8}
body.record main{width:1920px;margin:0}
body.record nav{display:none}
body.record #stage,body.record #film{width:1920px;height:1080px}
</style>
</head>
<body data-film="liquid-chrome-type" data-demo="liquid-chrome-type">
<main>
  <div id="stage">
    <canvas id="film" width="1920" height="1080"></canvas>
    <div id="hud">
      <div class="hud-row">
        <span class="pill" id="hudPhase">ACT 01 · TOP-DOWN MERCURY POUR</span>
        <span class="pill" id="hudSpec">SDF RAYMARCHER · F0 0.925 · 16-BIT EDT</span>
      </div>
      <div class="hud-row">
        <span class="pill" id="hudWord">WORD 01 / LIQUID</span>
        <span class="pill" id="hudFrame">F 0000 / 0720 · 60 FPS</span>
      </div>
    </div>
  </div>
  <nav>
    <button id="play" type="button">Play</button>
    <input id="scrub" aria-label="Timeline" type="range" min="0" max="12" step="0.01" value="0">
    <span id="time">0.00 / 12.00</span>
    <label>Pair
      <select id="pairSelect">
        <option value="LIQUID|動 · FORM">LIQUID → 動 · FORM</option>
        <option value="LIQUID|CHROME">LIQUID → CHROME</option>
        <option value="光影|MOTION">光影 → MOTION</option>
      </select>
    </label>
    <label>Custom (?text=) <input id="customText" type="text" placeholder="LIQUID|CHROME" size="18"></label>
  </nav>
</main>
<script type="module">
import { createChromeType } from "../fx/chrome-type/index.js";

const W = 1920, H = 1080, D = 12.0;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = (x) => { const u = clamp(x); return u * u * (3 - 2 * u); };

const canvas = document.getElementById("film");
const hud = document.getElementById("hud");
const hudPhase = document.getElementById("hudPhase");
const hudWord = document.getElementById("hudWord");
const hudFrame = document.getElementById("hudFrame");
const scrub = document.getElementById("scrub");
const timeEl = document.getElementById("time");
const playBtn = document.getElementById("play");
const pairSelect = document.getElementById("pairSelect");
const customInput = document.getElementById("customText");

const params = new URLSearchParams(location.search);
let customOverride = params.get("text") || "";
if (customOverride) customInput.value = customOverride;

function getWordPair() {
  const src = (customOverride || "").trim() || pairSelect.value;
  if (src.includes("|")) {
    const [a, b] = src.split("|").map((s) => s.trim());
    return [a || "LIQUID", b || "動 · FORM"];
  }
  return [src, "CHROME"];
}

// Explicit effect token for films.json proof check: id: "liquid-chrome-type"
let engine;
let record = false, playing = false, at = 0, startWall = 0;

function phaseCaption(localT, actNum) {
  if (localT < 1.5) return `ACT 0${actNum} · MERCURY POUR & NEGATIVE-RADIUS NUCLEATION`;
  if (localT < 2.3) return `ACT 0${actNum} · SPRING SETTLE (ZETA 0.55 · OMEGA 18)`;
  if (localT < 4.3) return `ACT 0${actNum} · SCULPTED CHROME HOLD & SOFTBOX GLINT`;
  return `ACT 0${actNum} · SURFACE-TENSION MELT & GRAVITY DRAIN`;
}

async function render(rawT) {
  const t = clamp(rawT, 0, D);
  const [word1, word2] = getWordPair();
  const isAct2 = t >= 6.0 && t < 12.0;
  const activeWord = isAct2 ? word2 : word1;
  // At t === 12.0s, localT === 0.0s (empty studio cyclorama === Frame 0!)
  const localT = t >= D ? 0 : t % 6.0;

  engine.frame(localT, { text: activeWord });

  // Fade HUD cleanly to 0 at t=0, t=6.0, and t=12.0 so loop seams are 100% pristine cyclorama
  const cycleFade = smooth((localT - 0.14) / 0.32) * (1 - smooth((localT - 5.45) / 0.36));
  hud.style.opacity = cycleFade.toFixed(3);
  if (cycleFade > 0.005) {
    const actNum = isAct2 ? 2 : 1;
    hudPhase.textContent = phaseCaption(localT, actNum);
    hudWord.textContent = `WORD 0${actNum} / ${activeWord}`;
    hudFrame.textContent = `F ${String(Math.round(t * 60)).padStart(4, "0")} / 0720 · 60 FPS`;
  }

  if (!record) {
    scrub.value = t;
    timeEl.textContent = `${t.toFixed(2)} / ${D.toFixed(2)}`;
  }
}

window.__SIZE = { w: W, h: H };
window.__DUR = D;
window.__FPS = 60;
window.__poster = 8.75;
window.__preview = [[0.75, 2.85], [6.75, 8.85]];
window.__music = [[0, "build"], [2.4, "drop"], [6.0, "break"], [7.2, "final"], [9.8, "tail"]];
window.__cues = () => [
  // Cycle 1 ("LIQUID")
  { t: 0.12, name: "whoosh", gain: 0.75 },
  { t: 0.55, name: "pop", gain: 0.7 },
  { t: 0.88, name: "pop", gain: 0.8 },
  { t: 1.48, name: "thump", gain: 0.85 },
  { t: 1.62, name: "tap", gain: 0.65 },
  { t: 2.35, name: "ping", gain: 0.7 },
  { t: 2.72, name: "scan", gain: 0.75 },
  { t: 4.35, name: "send", gain: 0.75 },
  { t: 4.95, name: "whoosh", gain: 0.7 },
  { t: 5.42, name: "pop", gain: 0.65 },
  // Cycle 2 ("動 · FORM")
  { t: 6.12, name: "whoosh", gain: 0.8 },
  { t: 6.55, name: "pop", gain: 0.75 },
  { t: 6.92, name: "pop", gain: 0.85 },
  { t: 7.48, name: "impact", gain: 0.72 },
  { t: 7.64, name: "tap", gain: 0.7 },
  { t: 8.35, name: "chime", gain: 0.68 },
  { t: 8.72, name: "scan", gain: 0.8 },
  { t: 10.35, name: "send", gain: 0.8 },
  { t: 10.95, name: "whoosh", gain: 0.72 },
  { t: 11.48, name: "ding", gain: 0.68 },
];

window.__ready = (async () => {
  engine = await createChromeType({ canvas, width: W, height: H, text: getWordPair()[0] });
  // Pre-bake second word so Act 1 -> Act 2 switch at 6.00s is zero-latency
  engine.frame(0, { text: getWordPair()[1] });
  await document.fonts.ready;
  await render(0);
})();

window.__render = async (t) => {
  await window.__ready;
  await render(t);
};

window.__record = async () => {
  record = true;
  playing = false;
  document.body.classList.add("record");
};

playBtn.onclick = () => {
  playing = !playing;
  if (at >= D) at = 0;
  startWall = performance.now() - at * 1000;
  playBtn.textContent = playing ? "Pause" : "Play";
};

scrub.oninput = () => {
  playing = false;
  playBtn.textContent = "Play";
  at = +scrub.value;
  window.__render(at);
};

pairSelect.onchange = () => {
  customOverride = "";
  customInput.value = "";
  window.__render(at);
};

customInput.oninput = () => {
  customOverride = customInput.value;
  window.__render(at);
};

let busy = false;
function loop(now) {
  if (playing && !record && !busy) {
    busy = true;
    at = (now - startWall) / 1000;
    if (at >= D) {
      at = at % D;
      startWall = now - at * 1000;
    }
    window.__render(at).finally(() => { busy = false; });
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
