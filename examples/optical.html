<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Optical effects — Motion FX Lab</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0a0f14;
        color: #f0f5f1;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1152px;
        margin: 30px auto;
        padding: 0 16px;
      }
      a {
        color: #b476ff;
      }
      header {
        display: flex;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
      }
      nav,
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 16px 0;
      }
      button {
        background: #18232b;
        color: inherit;
        border: 1px solid #3a4b58;
        padding: 9px 15px;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #b476ff;
        color: #0a0f14;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #b476ff;
        outline-offset: 3px;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
      }
      label {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      input {
        accent-color: #b476ff;
        max-width: 100%;
      }
      .note {
        color: #aebdc6;
        font-size: 13px;
      }
      #error {
        color: #ffb39e;
      }
      body.recording main {
        margin: 0;
        padding: 0;
        max-width: none;
      }
      body.recording header,
      body.recording nav,
      body.recording .controls,
      body.recording .note {
        display: none;
      }
      body.recording canvas {
        width: 1280px;
        height: 720px;
      }
      output {
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>
    <script src="../fx/optical-effects.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Six optical effects</h1>
        <a href="../index.html">Back to gallery</a>
      </header>
      <nav aria-label="Choose effect"></nav>
      <canvas
        width="1280"
        height="720"
        role="img"
        aria-label="Optical animation"
      ></canvas>
      <div class="controls">
        <button id="play">Pause</button
        ><label
          >Time
          <input
            id="time"
            type="range"
            min="0"
            max="8"
            step="0.01"
            value="0"
          /><output id="clock">0.00 s</output></label
        ><label
          >Strength
          <input
            id="strength"
            type="range"
            min="0.25"
            max="1.5"
            step="0.05"
            value="1"
        /></label>
      </div>
      <p id="note" class="note" aria-live="polite"></p>
      <p id="error" role="alert"></p>
      <p class="note">
        Canvas / GLSL / Flubber 0.4.2. Pause and scrub freely. The recorder
        plays each effect's own build, hit and aftermath in turn, one segment
        per effect, 31.6 seconds in all.
      </p>
    </main>
    <script>
      (() => {
        const modes = ["foil", "slit", "moire", "ribbon", "caustic", "morph"],
          names = [
            "Holographic foil",
            "Slit-scan type",
            "Moiré",
            "Paper ribbon",
            "Caustic light",
            "Path morph",
          ];
        const notes = [
          "A trading card flicks in the hand; a full-spectrum band and glitter follow the reflection angle. Art-directed diffraction, not thin-film optics.",
          "Column x shows the spinning banner at time t − (x / W) · Δ; Δ returns to zero and the word snaps back.",
          "A second grating slides over the first; a word hidden in it shows only while the layers move.",
          "Seven creases fold a printed strip into a loop. Kinematic folds, not cloth physics.",
          "Procedural approximation; not ray tracing.",
          "Flubber interpolates outer contours; holes are not supported.",
        ];
        // The film is a sampler: one segment per effect, each playing that effect's own
        // local time range [from, to). Film times are cumulative.
        const SEGMENTS = [
          { mode: "foil", from: -0.8, to: 5.2 },
          { mode: "slit", from: 0.4, to: 6.9 },
          { mode: "moire", from: 0.4, to: 6.9 },
          { mode: "ribbon", from: 0, to: 5.6 },
          { mode: "caustic", from: 0, to: 3 },
          { mode: "morph", from: 0.4, to: 4.4 },
        ];
        let start = 0;
        for (const seg of SEGMENTS) {
          seg.start = +start.toFixed(3);
          start += seg.to - seg.from;
          seg.end = +start.toFixed(3);
        }
        const DURATION = SEGMENTS.at(-1).end;
        const at = (mode, local) => {
          const seg = SEGMENTS.find((s) => s.mode === mode);
          return +(seg.start + local - seg.from).toFixed(3);
        };
        const canvas = document.querySelector("canvas"),
          time = document.getElementById("time"),
          strength = document.getElementById("strength"),
          play = document.getElementById("play");
        let selected = 0,
          t = 0,
          playing = !matchMedia("(prefers-reduced-motion: reduce)").matches,
          recording = false,
          last = 0;
        const frames = modes.map((m) => FXOptical.create(canvas, m));
        const period = (i) => FXOptical.periods[modes[i]];
        function draw() {
          try {
            frames[selected](t, Number(strength.value));
            time.value = t;
            document.getElementById("clock").textContent = t.toFixed(2) + " s";
            document.getElementById("error").textContent = "";
          } catch (e) {
            playing = false;
            play.textContent = "Play";
            document.getElementById("error").textContent = e.message;
            if (recording) throw e;
          }
        }
        function choose(i) {
          selected = i;
          time.max = period(i);
          t = Math.min(t, period(i) - 0.01);
          document
            .querySelectorAll("nav button")
            .forEach((b, j) => b.setAttribute("aria-pressed", String(i === j)));
          document.getElementById("note").textContent = notes[i];
          canvas.setAttribute("aria-label", names[i]);
          draw();
        }
        modes.forEach((_, i) => {
          const b = document.createElement("button");
          b.textContent = names[i];
          b.addEventListener("click", () => choose(i));
          document.querySelector("nav").appendChild(b);
        });
        play.textContent = playing ? "Pause" : "Play";
        play.addEventListener("click", () => {
          playing = !playing;
          play.textContent = playing ? "Pause" : "Play";
        });
        time.addEventListener("input", () => {
          playing = false;
          play.textContent = "Play";
          t = Number(time.value);
          draw();
        });
        strength.addEventListener("input", draw);
        window.__SIZE = { w: 1280, h: 720 };
        window.__DUR = DURATION;
        window.__ready = Promise.resolve();
        // Poster: the foil's full-spectrum sweep. The delivered MP4's video starts two frames
        // late (start_time 0.0667 s), so aim slightly after the 1.2 s centre of the sweep.
        window.__poster = at("foil", 1.26);
        // The full build synthesises and masters audio, not just video frames.
        window.__music = [
          [0, "build"],
          [2.4, "drop"],
          [12, "break"],
          [14.4, "lift"],
          [19.2, "final"],
          [29.4, "tail"],
        ];
        window.__gif = [
          [at("foil", 0.85), at("foil", 2.05)],
          [at("slit", 2.4), at("slit", 3.6)],
          [at("moire", 1.0), at("moire", 2.2)],
          [at("ribbon", 0.5), at("ribbon", 1.7)],
          [at("caustic", 0.4), at("caustic", 1.6)],
          [at("morph", 1.2), at("morph", 2.4)],
        ];
        window.__record = () => {
          recording = true;
          playing = false;
          document.body.classList.add("recording");
        };
        window.__render = (seconds) => {
          const clamped = Math.min(Math.max(seconds, 0), DURATION);
          let seg = SEGMENTS.find((s) => clamped < s.end);
          if (!seg) seg = SEGMENTS.at(-1);
          selected = modes.indexOf(seg.mode);
          t = seg.from + clamped - seg.start;
          strength.value = 1;
          draw();
        };
        window.__cues = () => [
          { t: at("foil", 0.78), name: "whoosh" },
          { t: at("foil", 1.12), name: "chime" },
          { t: at("foil", 4.3), name: "whoosh" },
          { t: at("slit", 1.0), name: "riser" },
          { t: at("slit", 2.88), name: "impact" },
          { t: at("slit", 5.82), name: "thump" },
          { t: at("moire", 0.9), name: "whoosh" },
          { t: at("moire", 1.45), name: "impact" },
          { t: at("moire", 6.0), name: "tap" },
          { t: at("ribbon", 0.1), name: "whoosh" },
          { t: at("ribbon", 0.78), name: "pop" },
          { t: at("ribbon", 1.4), name: "thump" },
          { t: at("caustic", 0), name: "whoosh" },
          { t: at("morph", 2.3), name: "pop" },
        ];
        window.opticalDemo = {
          modes,
          frames,
          canvas,
          choose,
          // Effect id -> [start, end] seconds in the recorded film.
          segments: SEGMENTS.map((s) => ({ id: "optical-" + s.mode, start: s.start, end: s.end, from: s.from, to: s.to })),
          pause: () => {
            playing = false;
            play.textContent = "Play";
          },
        };
        choose(0);
        function tick(now) {
          if (last && playing && !recording) {
            t = (t + Math.min((now - last) / 1000, 0.1)) % period(selected);
            draw();
          }
          last = now;
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
