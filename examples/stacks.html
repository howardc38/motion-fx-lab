<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Three film effects — Motion FX Lab</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        background: #09130f;
        color: #eff6e9;
        font: 15px system-ui;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        width: min(1280px, 100%);
      }
      #frame {
        position: relative;
        aspect-ratio: 16/9;
        width: 100%;
        background: #09130f;
      }
      #frame canvas[hidden] {
        display: none !important;
      }
      #frame canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #label {
        position: absolute;
        left: 3%;
        right: 3%;
        bottom: 4%;
        padding: 10px 15px;
        background: #07110edd;
        font: 16px monospace;
        color: #eff6e9;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        padding: 16px;
      }
      a {
        color: #c4f6ad;
      }
      button {
        font: inherit;
        padding: 8px 18px;
        cursor: pointer;
      }
      input {
        width: 260px;
        max-width: 60vw;
        accent-color: #c4f6ad;
      }
      body.record {
        display: block;
        min-height: 0;
      }
      body.record main {
        width: 1280px;
      }
      body.record #frame {
        width: 1280px;
        height: 720px;
      }
      body.record nav {
        display: none;
      }
      #error {
        color: #ffa890;
        padding: 16px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script src="../fx/stack-effects.js"></script>
  </head>
  <body>
    <main>
      <div id="frame"><div id="label">Loading film effects…</div></div>
      <nav>
        <a href="../index.html">Gallery</a><button id="play">Play</button
        ><label
          >Time
          <input
            id="time"
            type="range"
            min="0"
            max="24"
            step="0.033333"
            value="0" /></label
        ><output id="clock">0.00 s</output
        ><a href="stack-lab/">Effect settings</a>
      </nav>
      <p id="error" role="alert"></p>
    </main>
    <script>
      (() => {
        const frame = document.getElementById("frame"),
          label = document.getElementById("label"),
          slider = document.getElementById("time"),
          button = document.getElementById("play");
        const starts = [0, 7, 16],
          names = [
            "PIXIJS / LIQUID POSTER",
            "RAPIER / 3D DOMINO CHAIN",
            "WEBGPU + TSL / ORBITAL PARTICLES",
          ];
        let effects,
          clock = 0,
          recording = false,
          playing = false,
          last = 0;
        window.__SIZE = { w: 1280, h: 720 };
        window.__DUR = 24;
        window.__REQUIRES_WEBGPU = true;
        window.__music = [
          [0, "intro"],
          [2.4, "build"],
          [7.2, "drop"],
          [16.8, "final"],
          [21.6, "tail"],
        ];
        window.__cues = () => [
          { t: 7, name: "whoosh" },
          { t: 16, name: "whoosh" },
          { t: 20.5, name: "impact" },
        ];
        window.__poster = 19;
        window.__gif = [
          [2, 4],
          [10, 12],
          [19, 21],
        ];
        window.__ready = Promise.all(
          FXStack.studies.map((s) => FXStack.create(s.id)),
        ).then((result) => {
          effects = result;
          effects.forEach((effect) => {
            effect.canvas.hidden = true;
            frame.insertBefore(effect.canvas, label);
          });
        });
        window.__render = async (seconds) => {
          await __ready;
          const t = Math.max(0, Math.min(24, seconds)),
            i = t < 7 ? 0 : t < 16 ? 1 : 2;
          effects.forEach((effect, j) => (effect.canvas.hidden = i !== j));
          await effects[i].frame(t - starts[i]);
          label.textContent =
            names[i] + " · " + (t - starts[i]).toFixed(2) + " s";
          slider.value = t;
          document.getElementById("clock").textContent = t.toFixed(2) + " s";
        };
        window.__record = async () => {
          recording = true;
          playing = false;
          document.body.classList.add("record");
          await __ready;
        };
        window.stackFilm = {
          get effects() {
            return effects;
          },
        };
        let pending = Promise.resolve();
        function preview(t) {
          pending = pending.then(() => __render(t));
          pending.catch((e) => {
            playing = false;
            document.getElementById("error").textContent = e.message;
          });
          return pending;
        }
        button.onclick = () => {
          playing = !playing;
          button.textContent = playing ? "Pause" : "Play";
        };
        slider.oninput = () => {
          playing = false;
          button.textContent = "Play";
          clock = Number(slider.value);
          preview(clock);
        };
        async function loop(now) {
          if (recording) return;
          if (last && playing) {
            clock = (clock + Math.min((now - last) / 1000, 0.1)) % 24;
            await preview(clock);
          }
          last = now;
          requestAnimationFrame(loop);
        }
        __ready
          .then(() => preview(0))
          .then(() => requestAnimationFrame(loop))
          .catch((e) => {
            document.getElementById("error").textContent = e.message;
          });
      })();
    </script>
  </body>
</html>
