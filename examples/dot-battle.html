<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>COUNTERFORM — an original dot fight</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        background: #0c151b;
        color: #ebeee7;
        font: 15px system-ui;
      }
      main {
        max-width: 1280px;
        margin: auto;
      }
      #frame {
        width: 100%;
        aspect-ratio: 16/9;
      }
      #frame canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      nav {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        padding: 16px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 8px 18px;
        cursor: pointer;
      }
      a {
        color: #efba81;
      }
      input {
        width: 300px;
        max-width: 60vw;
      }
      #error {
        color: #fca68b;
      }
      body.record nav,
      body.record h1 {
        display: none;
      }
      body.record main,
      body.record #frame {
        width: 1280px;
        height: 720px;
      }
      h1 {
        font-size: 22px;
        padding: 0 16px;
      }
    </style>
    <script src="../fx/studio-effects.js"></script>
  </head>
  <body>
    <main>
      <h1>COUNTERFORM — an original dot fight</h1>
      <div id="frame"></div>
      <nav>
        <a href="../index.html">Gallery</a><button id="play">Play</button
        ><label
          >Time
          <input
            id="seek"
            type="range"
            min="0"
            max="19.2"
            step="0.033333"
            value="0" /></label
        ><output id="clock">0.00 s</output
        ><a href="studio.html">Effect settings</a>
      </nav>
      <p id="error" role="alert"></p>
    </main>
    <script type="module">
      import {
        BATTLE_DURATION,
        BATTLE_MUSIC,
        BATTLE_GIF,
        BATTLE_POSTER,
        battleCues,
      } from "../fx/studio/battle.js";
      window.__SIZE = { w: 1280, h: 720 };
      window.__DUR = BATTLE_DURATION;
      window.__music = BATTLE_MUSIC;
      window.__gif = BATTLE_GIF;
      window.__poster = BATTLE_POSTER;
      window.__cues = battleCues;
      let effect,
        playing = false,
        recording = false,
        t = 0,
        last = 0,
        pending = Promise.resolve();
      window.__ready = FXStudio.create("dot-battle").then((e) => {
        effect = e;
        document.getElementById("frame").appendChild(e.canvas);
        window.filmEffect = e;
      });
      window.__record = async () => {
        recording = true;
        playing = false;
        document.body.classList.add("record");
        await __ready;
      };
      window.__render = async (seconds) => {
        await __ready;
        await effect.frame(seconds);
        document.getElementById("seek").value = seconds;
        document.getElementById("clock").textContent =
          seconds.toFixed(2) + " s";
      };
      function render(s) {
        const r = pending.then(() => __render(s));
        pending = r.catch((e) => {
          playing = false;
          document.getElementById("error").textContent = e.message;
        });
        return r;
      }
      document.getElementById("play").onclick = () => {
        playing = !playing;
        document.getElementById("play").textContent = playing
          ? "Pause"
          : "Play";
      };
      document.getElementById("seek").oninput = (e) => {
        playing = false;
        t = Number(e.target.value);
        document.getElementById("play").textContent = "Play";
        render(t);
      };
      async function loop(now) {
        if (recording) return;
        if (last && playing) {
          t = (t + Math.min((now - last) / 1000, 0.1)) % __DUR;
          await render(t);
        }
        last = now;
        requestAnimationFrame(loop);
      }
      __ready
        .then(() => render(0))
        .then(() => requestAnimationFrame(loop))
        .catch(
          (e) => (document.getElementById("error").textContent = e.message),
        );
    </script>
  </body>
</html>
