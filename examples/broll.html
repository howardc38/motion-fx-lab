<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion FX Lab use case: background loops in place</title>
<script>
// ─── Edit here. The words laid over each loop, and the loops' colours. The show and guests are fictional. ──
const LOOP_SECONDS = 4;   // every loop closes on itself after this many seconds
const PLACES = {
  title: { show: "NIGHT SHIFT NOTES", episode: "EPISODE 12", title: ["What we got wrong", "about pricing"], colors: ["#ff90e8", "#3b5bff", "#ffd400", "#19c3b0"] },
  interview: { guests: [["Ada Moreno", "Founder, Paper Kite Studio"], ["Tomas Lind", "Host"]], topic: "Pricing a first product", colors: { line: "#f4f3ee", fill: "#0e0d12" } },
  waiting: { headline: ["Starting", "soon"], when: "Live Q&A · 7:00 pm", handle: "@nightshiftnotes", colors: ["#3b5bff", "#ff90e8"] },
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root { --ink: #0e0d12; --paper: #f4f3ee; --pink: #ff90e8; --sun: #ffd400; --blue: #3b5bff; --mint: #2fd39a;
    --lat: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: #111110; display: grid; place-items: center; }
  #frame { position: relative; overflow: hidden; background: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; font-family: var(--lat); color: var(--paper); -webkit-font-smoothing: antialiased; }
  body.record { display: block; }
  body.record #frame { position: fixed; left: 0; top: 0; }
  body.record #stage { transform: none !important; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; background: var(--ink); }
  .a { position: absolute; }
  .loop { position: absolute; left: 0; top: 0; }
  .use { left: 60px; top: 50px; font: 700 24px var(--mono); letter-spacing: .12em; color: var(--ink); background: var(--sun); padding: 10px 16px; border-radius: 10px; }
  .wide { font-weight: 900; font-stretch: 112%; letter-spacing: -.03em; line-height: .95; }
  .chip { font: 700 26px var(--mono); letter-spacing: .14em; padding: 10px 18px; border: 2px solid currentColor; border-radius: 999px; white-space: nowrap; }
  /* the seam check: the loop's last frame, its first frame and their measured difference */
  .seam { right: 50px; bottom: 44px; padding: 16px 18px; border-radius: 18px; background: rgba(14,13,18,.82); display: grid; grid-template-columns: auto auto; gap: 10px 14px; align-items: center; }
  .seam canvas { width: 192px; height: 108px; border-radius: 8px; display: block; }
  .seam .cap { font: 700 20px var(--mono); letter-spacing: .08em; color: rgba(244,243,238,.7); }
  .seam .bar { grid-column: 1 / 3; height: 8px; border-radius: 4px; background: rgba(244,243,238,.18); overflow: hidden; }
  .seam .bar i { display: block; height: 100%; width: 0; background: var(--paper); }
  .seam .ok { grid-column: 1 / 3; font: 800 28px var(--lat); color: var(--mint); }
  /* In the film the check gives way to a small finished caption: a ring that fills once per loop. */
  .looptag { right: 60px; bottom: 54px; display: none; align-items: center; gap: 14px; padding: 10px 22px 10px 12px; border-radius: 999px; background: rgba(14,13,18,.72); font: 700 22px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--paper); white-space: nowrap; }
  .looptag svg { width: 36px; height: 36px; display: block; }
  body.record .seam { display: none; }
  body.record .looptag { display: inline-flex; }
  .tile { position: absolute; top: 150px; width: 700px; height: 478px; border-radius: 28px; overflow: hidden; background: #1b1a24; box-shadow: 0 30px 80px rgba(0,0,0,.45); border: 3px solid rgba(244,243,238,.25); }
  .tile svg { width: 100%; height: 100%; display: block; }
  .name { position: absolute; left: 22px; bottom: 22px; padding: 10px 18px; border-radius: 12px; background: rgba(14,13,18,.8); font: 800 32px var(--lat); }
  .name span { display: block; font: 600 24px var(--lat); color: rgba(244,243,238,.75); }
  .lower { left: 140px; top: 790px; display: flex; flex-direction: column; gap: 10px; }
  .lower b { font: 900 60px var(--lat); font-stretch: 112%; background: var(--paper); color: var(--ink); padding: 8px 24px; align-self: flex-start; }
  .lower span { font: 700 28px var(--mono); background: var(--pink); color: var(--ink); padding: 8px 16px; align-self: flex-start; }
  .live { display: inline-flex; align-items: center; gap: 14px; }
  .live i { width: 22px; height: 22px; border-radius: 50%; background: #ff4b4b; }
</style>
</head>
<body>
<div id="frame">
<div id="stage" data-w="1920" data-h="1080" data-dur="12">
  <!-- each scene is one loop in a place it would be used: frame(4 s) is frame(0), so it repeats with no seam -->
  <section class="scene" data-start="0" data-trans="cut" id="s1"></section>
  <section class="scene" data-start="4" data-trans="cut" id="s2"></section>
  <section class="scene" data-start="8" data-trans="cut" id="s3"></section>
</div>
</div>
<script>
(() => {
  const P = LOOP_SECONDS, TAU = Math.PI * 2, W = 1920, H = 1080;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // A seeded generator, so every render draws the same loops.
  let seed = 20260929;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

  // ── The loops. Each draws a whole 1920 × 1080 frame for a phase u in [0, 2π); u and u + 2π draw the same frame.
  // orbs: four glowing fields, each on a closed path it completes a whole number of times per loop.
  const orbs = PLACES.title.colors.map((c, i) => ({ c, cx: 480 + i * 330, cy: 540, rx: 380 - i * 40, ry: 230 + i * 20, m: [1, 1, 2, 1][i], ph: i * 1.7 }));
  function drawOrbs(g, u) {
    g.globalCompositeOperation = "source-over"; g.fillStyle = "#0e0d12"; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = "screen";
    for (const o of orbs) {
      const x = o.cx + o.rx * Math.cos(o.m * u + o.ph), y = o.cy + o.ry * Math.sin(o.m * u + o.ph);
      const gr = g.createRadialGradient(x, y, 0, x, y, 700);
      gr.addColorStop(0, rgba(o.c, 0.95)); gr.addColorStop(0.45, rgba(o.c, 0.35)); gr.addColorStop(1, rgba(o.c, 0));
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
    g.globalCompositeOperation = "source-over";
  }
  // ridgelines: 34 lines of noise from sines whose time frequencies are whole multiples of 1/P.
  const LINES = 34, PTS = 150;
  const waves = Array.from({ length: LINES }, () => Array.from({ length: 4 }, (_, k) => ({ f: (0.004 + rnd() * 0.004) * (k + 1), p: rnd() * TAU, m: 1 + (k % 2), a: 1 / (k + 1) })));
  function drawRidges(g, u) {
    const { line, fill } = PLACES.interview.colors;
    g.fillStyle = fill; g.fillRect(0, 0, W, H);
    g.lineWidth = 2.2; g.strokeStyle = line;
    for (let i = 0; i < LINES; i++) {
      const base = 250 + i * 22;
      g.beginPath();
      for (let j = 0; j <= PTS; j++) {
        const x = -10 + (j / PTS) * 1940, env = Math.exp(-Math.pow((x - 960) / 420, 2));
        let n = 0;
        for (const w of waves[i]) n += w.a * Math.sin(w.f * x + w.p + w.m * u);
        const y = base - env * (70 + 90 * Math.max(0, n));
        j ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      // The closing edges run outside the frame, so their stroke never shows.
      g.lineTo(1930, 1090); g.lineTo(-10, 1090); g.closePath();
      g.fill(); g.stroke();
    }
  }
  // network: 130 points, each on a Lissajous path closed over P, joined when close.
  const nodes = Array.from({ length: 130 }, () => ({ x: rnd() * W, y: rnd() * H, ax: 40 + rnd() * 120, ay: 40 + rnd() * 90, mx: 1 + Math.floor(rnd() * 2), my: 1 + Math.floor(rnd() * 2), px: rnd() * TAU, py: rnd() * TAU }));
  function drawNetwork(g, u) {
    const [c1, c2] = PLACES.waiting.colors;
    g.fillStyle = "#0e0d12"; g.fillRect(0, 0, W, H);
    const pos = nodes.map((n) => [n.x + n.ax * Math.sin(n.mx * u + n.px), n.y + n.ay * Math.sin(n.my * u + n.py)]);
    g.lineWidth = 1.6;
    for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
      const dd = Math.hypot(pos[i][0] - pos[j][0], pos[i][1] - pos[j][1]);
      if (dd < 190) { g.strokeStyle = rgba(i % 3 ? c1 : c2, +(1 - dd / 190).toFixed(3)); g.beginPath(); g.moveTo(pos[i][0], pos[i][1]); g.lineTo(pos[j][0], pos[j][1]); g.stroke(); }
    }
    g.fillStyle = "#f4f3ee";
    for (const [x, y] of pos) { g.beginPath(); g.arc(x, y, 3.2, 0, TAU); g.fill(); }
  }
  const LOOPS = [drawOrbs, drawRidges, drawNetwork];

  // ── What sits on top of each loop: the place it is used.
  const seamPanel = (i) => `<div class="a seam" id="seam${i}" data-fx="up" data-at="2.2"><canvas width="192" height="108"></canvas><canvas width="192" height="108"></canvas>` +
    `<div class="cap">END ${P.toFixed(1)} S</div><div class="cap">START 0.0 S</div><div class="bar"><i></i></div><div class="ok">✓ Seamless · <span class="d"></span></div></div>`;
  const RING = 2 * Math.PI * 14;
  const loopTag = () => `<div class="a looptag" data-fx="fade" data-at="0.5"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(244,243,238,.25)" stroke-width="4"/>` +
    `<circle class="fill" cx="18" cy="18" r="14" fill="none" stroke="#2fd39a" stroke-width="4" stroke-linecap="round" stroke-dasharray="${RING.toFixed(2)} ${RING.toFixed(2)}" transform="rotate(-90 18 18)"/></svg>Seamless ${P}-second loop</div>`;
  const T = PLACES.title, I = PLACES.interview, Wt = PLACES.waiting;
  document.getElementById("s1").innerHTML =
    `<canvas class="loop" width="${W}" height="${H}" data-effect="orbs"></canvas>` +
    `<div class="a use">USE 1 · OPENING TITLE · COLOUR FIELDS</div>` +
    `<div class="a chip" style="left:150px;top:300px;color:var(--paper)" data-fx="fade" data-at="0.1">${esc(T.show)} · ${esc(T.episode)}</div>` +
    T.title.map((l, k) => `<div class="a wide" style="left:140px;top:${400 + k * 150}px;font-size:140px;white-space:nowrap" data-fx="chars" data-at="${0.3 + k * 0.35}" data-stagger="0.025" data-sfx="${k ? "" : "whoosh"}">${esc(l)}</div>`).join("") +
    seamPanel(0) + loopTag();
  document.getElementById("s2").innerHTML =
    `<canvas class="loop" width="${W}" height="${H}" data-effect="ridgelines"></canvas>` +
    `<div class="a use">USE 2 · INTERVIEW BACKDROP · RIDGELINES</div>` +
    I.guests.map(([n, r], k) => `<div class="tile" style="left:${k ? 1100 : 120}px" data-fx="up" data-at="${0.1 + k * 0.15}">${person(k)}<div class="name">${esc(n)}<span>${esc(r)}</span></div></div>`).join("") +
    `<div class="a lower" data-fx="left" data-at="0.6"><b>${esc(I.topic)}</b><span>${esc(I.guests[0][0])} · ${esc(I.guests[0][1])}</span></div>` +
    seamPanel(1) + loopTag();
  document.getElementById("s3").innerHTML =
    `<canvas class="loop" width="${W}" height="${H}" data-effect="network"></canvas>` +
    `<div class="a use">USE 3 · "STARTING SOON" SCREEN · NETWORK</div>` +
    `<div class="a chip live" style="left:150px;top:300px;color:var(--paper)" data-fx="fade" data-at="0.1"><i data-fx="blink" data-at="0.1"></i>${esc(Wt.when)}</div>` +
    Wt.headline.map((l, k) => `<div class="a wide" style="left:140px;top:${400 + k * 190}px;font-size:200px;white-space:nowrap${k ? ";color:var(--pink)" : ""}" data-fx="whip" data-dx="700" data-at="${0.2 + k * 0.15}" data-sfx="${k ? "" : "whoosh"}">${esc(l)}</div>`).join("") +
    `<div class="a" style="left:150px;top:830px;font:700 34px var(--mono);color:var(--sun)" data-fx="up" data-at="0.6">${esc(Wt.handle)}</div>` +
    seamPanel(2) + loopTag();

  // Geometric editorial portraits + reactive speaking waveform rings, closed on the 4-second loop.
  function person(k) {
    const id = `av${k}`;
    if (k === 0) {
      // Ada Moreno — Founder, Paper Kite Studio
      return `<svg viewBox="0 0 820 560" aria-hidden="true">
        <defs>
          <linearGradient id="${id}bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191829"/><stop offset="1" stop-color="#2a243d"/></linearGradient>
          <radialGradient id="${id}glow" cx=".5" cy=".44" r=".52"><stop offset="0" stop-color="#ff90e8" stop-opacity=".28"/><stop offset=".6" stop-color="#3b5bff" stop-opacity=".12"/><stop offset="1" stop-color="#191829" stop-opacity="0"/></radialGradient>
          <linearGradient id="${id}coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c6bff"/><stop offset="1" stop-color="#253ec7"/></linearGradient>
        </defs>
        <rect width="820" height="560" fill="url(#${id}bg)"/>
        <g opacity=".12" fill="#f4f3ee">${Array.from({ length: 7 }, (_, j) => `<rect x="${560 + j * 30}" y="46" width="12" height="290" rx="6"/>`).join("")}</g>
        <rect width="820" height="560" fill="url(#${id}glow)"/>
        <g class="waves" data-k="0" transform="translate(410 252)">
          <circle class="wring" r="142" fill="none" stroke="#ff90e8" stroke-width="3.5" opacity=".45"/>
          <circle class="wring" r="182" fill="none" stroke="#ffd400" stroke-width="2.5" stroke-dasharray="18 14" opacity=".32"/>
          <circle class="wring" r="224" fill="none" stroke="#f4f3ee" stroke-width="2" opacity=".18"/>
        </g>
        <g class="who" data-k="0">
          <!-- Back sculpted wavy espresso hair -->
          <path d="M286 348 C264 258 292 128 410 118 C528 128 556 258 530 352 C504 374 316 374 286 348 Z" fill="#1b1214"/>
          <path d="M300 336 C284 252 312 142 414 132 C496 140 528 214 518 326 Z" fill="#2c1d20"/>
          <!-- Tailored cobalt blazer + cream mock-neck -->
          <path d="M188 560 C202 432 284 378 410 378 C536 378 618 432 632 560 Z" fill="url(#${id}coat)"/>
          <path d="M352 384 L410 492 L468 384 Z" fill="#f4f3ee"/>
          <path d="M332 382 L392 520 L356 560 L304 424 Z" fill="#1e319e"/>
          <path d="M488 382 L428 520 L464 560 L516 424 Z" fill="#1e319e"/>
          <!-- Neck & warm studio-lit facial planes -->
          <path d="M376 318 L444 318 L452 396 C426 410 394 410 368 396 Z" fill="#b36c4c"/>
          <path d="M376 318 L428 318 L412 374 L372 358 Z" fill="#8f5035" opacity=".55"/>
          <!-- Gold hoop earrings -->
          <circle cx="316" cy="278" r="14" fill="none" stroke="#ffd400" stroke-width="5"/>
          <circle cx="504" cy="278" r="14" fill="none" stroke="#ffd400" stroke-width="5"/>
          <!-- Sculpted editorial head -->
          <path d="M322 232 C322 166 360 144 410 144 C460 144 498 166 498 232 C498 298 462 346 410 348 C358 346 322 298 322 232 Z" fill="#cc8460"/>
          <!-- Warm key-light plane on left cheek/forehead & rim highlight -->
          <path d="M326 232 C326 172 362 148 412 148 L412 344 C364 342 326 296 326 232 Z" fill="#dc9672"/>
          <path d="M326 218 C328 180 352 156 388 150" fill="none" stroke="#ffd8be" stroke-width="5" stroke-linecap="round" opacity=".65"/>
          <!-- Geometric nose plane, composed lips, brows & editorial wireframe glasses -->
          <path d="M410 218 L410 274 L396 278 Z" fill="#9e593c" opacity=".55"/>
          <path d="M352 214 Q376 204 396 212 M424 212 Q444 204 468 214" fill="none" stroke="#241516" stroke-width="5.5" stroke-linecap="round"/>
          <ellipse cx="374" cy="238" rx="22" ry="18" fill="rgba(255,244,230,.08)" stroke="#ffd400" stroke-width="3.5"/>
          <ellipse cx="446" cy="238" rx="22" ry="18" fill="rgba(255,244,230,.08)" stroke="#ffd400" stroke-width="3.5"/>
          <line x1="396" y1="236" x2="424" y2="236" stroke="#ffd400" stroke-width="3.5"/>
          <path d="M362 238 Q374 232 386 238 M434 238 Q446 232 458 238" fill="none" stroke="#241516" stroke-width="4.2" stroke-linecap="round"/>
          <path d="M388 302 Q410 296 432 302 Q410 315 388 302 Z" fill="#9c433c"/>
          <!-- Swept front hair locks -->
          <path d="M316 244 C314 172 364 132 426 134 C478 136 508 176 504 242 C486 196 456 178 424 176 C384 198 344 198 316 244 Z" fill="#1b1214"/>
        </g>
        <g class="vmeter" data-k="0" transform="translate(658 34)">
          <rect width="128" height="40" rx="20" fill="rgba(14,13,18,.74)" stroke="rgba(244,243,238,.2)" stroke-width="1.5"/>
          ${Array.from({ length: 7 }, (_, b) => `<rect class="vbar" x="${22 + b * 13}" y="12" width="6" height="16" rx="3" fill="#ff90e8"/>`).join("")}
        </g>
      </svg>`;
    }
    // Tomas Lind — Host
    return `<svg viewBox="0 0 820 560" aria-hidden="true">
      <defs>
        <linearGradient id="${id}bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1c2c"/><stop offset="1" stop-color="#25293e"/></linearGradient>
        <radialGradient id="${id}glow" cx=".5" cy=".44" r=".52"><stop offset="0" stop-color="#2fd39a" stop-opacity=".24"/><stop offset=".6" stop-color="#3b5bff" stop-opacity=".12"/><stop offset="1" stop-color="#1b1c2c" stop-opacity="0"/></radialGradient>
        <linearGradient id="${id}jkt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c314a"/><stop offset="1" stop-color="#191c2d"/></linearGradient>
      </defs>
      <rect width="820" height="560" fill="url(#${id}bg)"/>
      <circle cx="150" cy="120" r="88" fill="none" stroke="rgba(244,243,238,.07)" stroke-width="24"/>
      <rect width="820" height="560" fill="url(#${id}glow)"/>
      <g class="waves" data-k="1" transform="translate(410 252)">
        <circle class="wring" r="142" fill="none" stroke="#2fd39a" stroke-width="3.5" opacity=".42"/>
        <circle class="wring" r="182" fill="none" stroke="#ffd400" stroke-width="2.5" stroke-dasharray="18 14" opacity=".28"/>
        <circle class="wring" r="224" fill="none" stroke="#f4f3ee" stroke-width="2" opacity=".16"/>
      </g>
      <g class="who" data-k="1">
        <!-- Studio headphone headband -->
        <path d="M304 252 C304 144 348 112 410 112 C472 112 516 144 516 252" fill="none" stroke="#d8dadf" stroke-width="11" stroke-linecap="round"/>
        <!-- Structured studio overshirt + warm pink crew tee accent -->
        <path d="M184 560 C198 426 284 376 410 376 C536 376 622 426 636 560 Z" fill="url(#${id}jkt)"/>
        <path d="M360 384 C382 418 438 418 460 384 L446 560 L374 560 Z" fill="#ff90e8"/>
        <path d="M342 378 L378 446 L342 468 L314 398 Z" fill="#3a4060"/>
        <path d="M478 378 L442 446 L478 468 L506 398 Z" fill="#3a4060"/>
        <!-- Neck & sculpted angular head planes -->
        <path d="M372 316 L448 316 L456 394 C428 408 392 408 364 394 Z" fill="#cfa082"/>
        <path d="M372 316 L426 316 L410 368 L368 352 Z" fill="#ad7b5e" opacity=".5"/>
        <!-- Over-ear studio monitor cups -->
        <rect x="292" y="224" width="32" height="72" rx="16" fill="#141622" stroke="#2fd39a" stroke-width="3.5"/>
        <rect x="496" y="224" width="32" height="72" rx="16" fill="#141622" stroke="#2fd39a" stroke-width="3.5"/>
        <!-- Editorial head & crisp jawline -->
        <path d="M322 224 C322 162 358 140 410 140 C462 140 498 162 498 224 L492 288 C488 326 452 350 410 350 C368 350 332 326 328 288 Z" fill="#e6b798"/>
        <path d="M326 224 C326 166 360 144 410 144 L410 346 C370 346 336 322 332 286 Z" fill="#f1c6aa"/>
        <!-- Subtle short beard/jaw shadow plane -->
        <path d="M332 276 C348 312 378 326 410 326 C442 326 472 312 488 276 L486 292 C478 328 448 348 410 348 C372 348 342 328 334 292 Z" fill="#8b6249" opacity=".28"/>
        <!-- Brows, eyes, nose bridge & composed host expression -->
        <path d="M410 214 L410 272 L424 276 Z" fill="#b88467" opacity=".6"/>
        <path d="M352 212 L392 210 M428 210 L468 212" fill="none" stroke="#472d1e" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M360 236 Q375 230 390 236 M430 236 Q445 230 460 236" fill="none" stroke="#231815" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M390 302 Q410 308 430 300" fill="none" stroke="#9e5c4b" stroke-width="5" stroke-linecap="round"/>
        <!-- Side-parted chestnut hair -->
        <path d="M318 228 C316 158 356 124 416 124 C472 124 506 158 502 226 C490 192 468 176 438 174 C402 186 356 184 336 168 C328 186 322 206 318 228 Z" fill="#523523"/>
        <path d="M342 154 C374 136 428 134 468 152" fill="none" stroke="#754e36" stroke-width="6" stroke-linecap="round" opacity=".7"/>
        <!-- Broadcast boom mic arm -->
        <path d="M520 390 Q492 332 444 316" fill="none" stroke="#d8dadf" stroke-width="6" stroke-linecap="round"/>
        <rect x="424" y="305" width="26" height="16" rx="8" fill="#141622" stroke="#ffd400" stroke-width="2.5"/>
      </g>
      <g class="vmeter" data-k="1" transform="translate(658 34)">
        <rect width="128" height="40" rx="20" fill="rgba(14,13,18,.74)" stroke="rgba(244,243,238,.2)" stroke-width="1.5"/>
        ${Array.from({ length: 7 }, (_, b) => `<rect class="vbar" x="${22 + b * 13}" y="12" width="6" height="16" rx="3" fill="#2fd39a"/>`).join("")}
      </g>
    </svg>`;
  }

  // ── Wire up: each scene's canvas, its seam check, and a measured first/last difference.
  const scenes = [...document.querySelectorAll(".scene")];
  const big = scenes.map((s) => s.querySelector("canvas.loop").getContext("2d"));
  const seams = scenes.map((s, i) => {
    const [a, b] = [...s.querySelectorAll(".seam canvas")].map((c) => c.getContext("2d"));
    // Draw the loop at its end (u = 2π) and its start (u = 0) at thumbnail size and compare the pixels.
    for (const [g, u] of [[a, TAU], [b, 0]]) { g.save(); g.scale(192 / W, 108 / H); LOOPS[i](g, u); g.restore(); }
    const da = a.getImageData(0, 0, 192, 108).data, db = b.getImageData(0, 0, 192, 108).data;
    let diff = 0;
    for (let k = 0; k < da.length; k++) diff += Math.abs(da[k] - db[k]);
    s.querySelector(".seam .d").textContent = `Δ ${(diff / da.length / 2.55).toFixed(2)}%`;
    return { bar: s.querySelector(".seam .bar i"), ring: s.querySelector(".looptag .fill") };
  });
  const whos = [...document.querySelectorAll(".who")];
  const waveGroups = [...document.querySelectorAll(".waves")].map((el) => [...el.querySelectorAll(".wring")]);
  const meterBars = [...document.querySelectorAll(".vmeter")].map((el) => [...el.querySelectorAll(".vbar")]);

  window.__preview = [[1.0, 3.2], [4.2, 6.2], [8.4, 10.4]];   // the card's silent loop; the MP4 is the film
  window.__poster = 5.5;   // the interview over the ridgelines
  window.__music = [[0, "intro"], [2.4, "build"], [4.8, "drop"], [9.6, "tail"]];
  window.__effects = [
    { id: "orbs", at: [0, 4] }, { id: "chars", at: [0.3, 1.4] }, { id: "ridgelines", at: [4, 8] },
    { id: "whip", at: [8.2, 8.8] },
  ];
  window.__renderHooks = window.__renderHooks || [];
  window.__renderHooks.push((t) => {
    const i = Math.min(2, Math.floor(t / P)), local = t - i * P, u = (local / P) * TAU;
    LOOPS[i](big[i], u);
    seams[i].bar.style.width = `${((local / P) * 100).toFixed(2)}%`;
    seams[i].ring.setAttribute("stroke-dashoffset", (RING * (1 - local / P)).toFixed(2));
    if (i === 1) {
      whos.forEach((w, k) => {
        const talk = Math.pow(0.5 + 0.5 * Math.cos(u - (k ? 5.2 : 2.1)), 1.6);
        const syl = 0.6 + 0.4 * Math.sin(3 * u + k * 1.7);
        const e = talk * syl;
        w.setAttribute("transform", `translate(0 ${(5 * Math.sin(u * (k + 1) + k)).toFixed(2)}) rotate(${(1.2 * Math.sin(u + k * 2)).toFixed(2)} 410 380)`);
        waveGroups[k].forEach((r, j) => {
          const pulse = 1 + e * (0.045 + j * 0.032) + 0.015 * Math.sin(2 * u - j * 0.9 + k);
          const alpha = 0.1 + e * (0.58 - j * 0.14);
          r.setAttribute("transform", `scale(${pulse.toFixed(3)})`);
          r.setAttribute("opacity", alpha.toFixed(3));
        });
        meterBars[k].forEach((bar, b) => {
          const h = 6 + 22 * e * (0.45 + 0.55 * Math.abs(Math.sin(2 * u + b * 0.85 + k)));
          bar.setAttribute("y", (20 - h / 2).toFixed(2));
          bar.setAttribute("height", h.toFixed(2));
          bar.setAttribute("opacity", (0.35 + 0.65 * e).toFixed(2));
        });
      });
    }
  });
  window.__ready = document.fonts.ready;
})();
</script>
<script src="../video/engine.js"></script>
