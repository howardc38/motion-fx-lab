<script>
(() => {
  const key = new URLSearchParams(location.search).get("shop") || SHOP;
  const S = SHOPS[key];
  if (!S) throw new Error(`unknown shop "${key}"; known: ${Object.keys(SHOPS).join(", ")}`);
  const C = S.colors;
  for (const [k, v] of Object.entries(C)) document.documentElement.style.setProperty(`--${k}`, v);
  document.title = `${S.name.join(" ")}: weekend promo`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // 100 BPM, as video/music.py plays it: every pop below lands on this grid.
  const BEAT = 0.6;
  // Where the apps draw their own buttons and captions on a 1080 × 1920 frame (the union of Reels, TikTok and
  // Shorts): nothing important goes in these bands, nor in TikTok's right-hand column below y = 840.
  window.__safe = { top: 288, bottom: 672, left: 120, right: 192, column: { x: 780, y: 840 } };

  // Each copy of the drawing gets its own SVG ids. Clip paths resolve by id, and one inside a scene that is
  // hidden would clip every later copy to nothing.
  let copies = 0;
  const drawing = (hero = false) => {
    const p = `art${copies++}`;
    return ART[S.art](C, hero).replace(/id="(?!artshine")([^"]+)"/g, `id="${p}-$1"`).replace(/url\(#([^)]+)\)/g, `url(#${p}-$1)`);
  };

  // ── 1 · hook (0–1.8 s): the question is revealed word by word and each word lights as it lands (karaoke).
  const hookAt = (i) => 0.12 + i * 0.27;
  document.getElementById("s1").innerHTML =
    `<div class="a tag" data-fx="fade" data-at="0.05">${esc(S.handle)} · ${esc(S.tag)}</div>` +
    `<div class="a hookw" id="hook" data-effect="hook karaoke">${S.hook.map((w) => `<span class="w"><span>${esc(w)}</span></span>`).join("")}</div>` +
    `<div class="deco" style="left:300px;top:1260px;width:480px;height:640px" data-fx="up" data-at="0.5" data-dur="0.6">${drawing()}</div>` +
    `<div class="a bars" id="bars" data-effect="beat">${Array.from({ length: 16 }, () => "<i></i>").join("")}</div>`;

  // ── 2 · product and price (1.8–4.2 s): the drawing rises, light sweeps across it, the price slams on the drop.
  document.getElementById("s2").insertAdjacentHTML("beforeend",
    `<div class="a halo" id="halo"></div>` +
    `<div class="a" id="shaker" style="inset:0" data-effect="stamp" data-fx="shake" data-at="0.6" data-dur="0.45" data-amp="16">` +
    `<div class="a art" id="art" data-fx="up" data-at="0.05" data-dur="0.5">${drawing(true)}</div>` +
    `<div class="a pname" data-fx="left" data-at="0.9">${esc(S.product)}</div></div>` +
    `<div class="a price" data-effect="sticker" style="transform:rotate(-4deg)" data-fx="slam" data-at="0.6" data-base="rotate(-4deg)" data-sfx="stamp">${esc(S.offer)}</div>` +
    `<div class="a note" style="top:520px" data-fx="up" data-at="0.95">${esc(S.offerNote)}</div>` +
    `<div class="a flash" data-fx="flash" data-at="0.6" data-dur="0.3"></div>`);

  // ── 3 · three reasons (4.2–7.2 s): each whips in and lands on a beat.
  const lands = [4.8, 5.4, 6.0];
  // The product shrinks to the corner and keeps its halo, scaled with it, so the list has a clear field.
  document.getElementById("s3").insertAdjacentHTML("beforeend",
    `<div class="deco" style="left:520px;top:1180px;width:560px;height:747px" data-fx="up" data-at="0.1" data-dur="0.6"><div class="a halo" style="left:280px;top:312px;width:610px;height:610px;margin:-305px 0 0 -305px;opacity:.6"></div>${drawing()}</div>` +
    S.points.map((p, i) => `<div class="a pt" style="top:${320 + i * 250}px" data-effect="whip beat" data-fx="whip" data-dx="640" data-at="${(lands[i] - 4.2 - 0.45).toFixed(2)}" data-sfx="pop" data-sfx-at="${(lands[i] - 4.2).toFixed(2)}"><i class="tick">✓</i><b>${esc(p)}</b></div>`).join(""));

  // ── 4 · proof (7.2–9.6 s): the rating and review count count up; a review is read out word by word.
  const quoteAt = (i) => 8.2 + i * 0.18;
  document.getElementById("s4").insertAdjacentHTML("beforeend",
    `<div class="deco" style="left:560px;top:1200px;width:560px;height:747px" data-fx="up" data-at="0.1" data-dur="0.6">${drawing()}</div>` +
    `<div class="a score" data-effect="count"><span id="score">0.0</span></div>` +
    `<div class="a stars" id="stars">${Array.from({ length: 5 }, (_, i) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17l-5.9 3.3 1.3-6.6L2.5 9.1l6.6-.8z" fill="${C.accent}" data-fx="pop" data-at="${(0.35 + i * 0.12).toFixed(2)}" data-sfx="tick" data-sfx-gain="0.6"/></svg>`).join("")}</div>` +
    `<div class="a revs" data-fx="up" data-at="0.3"><span data-fx="count" data-to="${S.reviews}" data-at="0.3" data-dur="1.1" data-sfx="riser">0</span> reviews</div>` +
    `<div class="a quote" data-fx="up" data-at="0.85"><div class="k" id="quote" data-effect="karaoke">${S.quote.map((w) => `<span>${esc(w)}</span>`).join(" ")}</div><div class="by">${esc(S.quoteBy)}</div></div>`);

  // ── 5 · call to action (9.6–12 s): shop name, link, and a ring counting down the days left.
  document.getElementById("s5").style.background = C.deep;
  document.getElementById("s5").insertAdjacentHTML("beforeend",
    `<div class="deco" style="left:330px;top:1220px;width:560px;height:747px" data-fx="up" data-at="0.2" data-dur="0.6">${drawing()}</div>` +
    `<div class="a shop" data-fx="chars" data-at="0.05" data-stagger="0.035">${esc(S.name[0])}</div>` +
    `<div class="a shop" style="top:470px;color:${C.accent}" data-fx="chars" data-at="0.25" data-stagger="0.035">${esc(S.name[1])}</div>` +
    `<div class="a cta" data-effect="sticker" style="transform:rotate(-3deg)" data-fx="pop" data-at="0.55" data-base="rotate(-3deg)" data-sfx="ding">${esc(S.cta)}</div>` +
    `<svg class="a ring" viewBox="0 0 340 340" data-effect="ring count" data-fx="fade" data-at="0.7" aria-hidden="true"><circle cx="170" cy="170" r="150" fill="none" stroke="${C.soft}" stroke-width="26"/><circle id="arc" cx="170" cy="170" r="150" fill="none" stroke="${C.pop}" stroke-width="26" stroke-linecap="round" transform="rotate(-90 170 170)"/></svg>` +
    `<div class="a ringtxt" data-fx="fade" data-at="0.7"><b id="days">7</b><span>days left</span></div>` +
    `<div class="a ends" data-fx="up" data-at="0.9">${esc(S.ends)}</div>` +
    `<div class="a handle" data-fx="up" data-at="1.05">${esc(S.handle)}</div>`);

  window.__preview = [[2.2, 4.0], [4.6, 6.4], [7.6, 9.4], [10.0, 11.4]];   // the card's silent loop; the MP4 is the film
  window.__poster = 3.0;   // the price on the product: the reel's hero frame
  window.__music = [[0, "build"], [2.4, "drop"], [7.2, "lift"], [9.6, "tail"]];
  window.__effects = [
    { id: "hook", at: [0.12, 1.6] }, { id: "karaoke", at: [0.12, 1.8] }, { id: "beat", at: [0, 1.8] },
    { id: "sweep", at: [2.15, 3.05] }, { id: "sticker", at: [2.4, 2.8] }, { id: "stamp", at: [2.4, 2.85] },
    { id: "whip", at: [4.35, 6.45] }, { id: "beat", at: [4.8, 7.2] }, { id: "count", at: [7.4, 8.6] },
    { id: "karaoke", at: [8.2, 9.3] }, { id: "sticker", at: [10.15, 10.6] }, { id: "ring", at: [10.3, 12] },
  ];

  const clamp = (v) => Math.max(0, Math.min(1, v));
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const hookWords = [...document.querySelectorAll("#hook .w")];
  const bars = [...document.querySelectorAll("#bars i")];
  const quoteWords = [...document.querySelectorAll("#quote span")];
  const ticks = [...document.querySelectorAll("#s3 .tick")], points = [...document.querySelectorAll("#s3 .pt")], decos = [...document.querySelectorAll(".deco")];
  const art = document.getElementById("art"), artShine = document.getElementById("artshine"), halo = [...document.querySelectorAll(".halo")];
  const score = document.getElementById("score"), arc = document.getElementById("arc"), days = document.getElementById("days");
  const RING = 2 * Math.PI * 150;
  arc.setAttribute("stroke-dasharray", `${RING} ${RING}`);
  const pulse = (t) => { const p = ((t % BEAT) + BEAT) % BEAT; return Math.exp(-p * 9); };   // 1 on each beat, decaying
  window.__renderHooks = window.__renderHooks || [];
  window.__renderHooks.push((t) => {
    // hook + karaoke: a word rises out of its mask at its time, holds the accent until the next word lands.
    hookWords.forEach((w, i) => {
      const k = eo(clamp((t - hookAt(i)) / 0.26));
      w.firstChild.style.transform = `translateY(${((1 - k) * 105).toFixed(1)}%)`;
      w.classList.toggle("now", t >= hookAt(i) && t < hookAt(i + 1) + 0.1);
    });
    // beat: the bars and the halo kick on every beat.
    const b = pulse(t);
    bars.forEach((el, i) => {
      const v = 0.25 + 0.75 * Math.abs(Math.sin(i * 1.7 + Math.floor(t / BEAT) * 2.3));
      el.style.height = `${(16 + 104 * v * (0.35 + 0.65 * b) * clamp(t / 0.3)).toFixed(1)}px`;
    });
    halo.forEach((h) => { h.style.transform = `scale(${(1 + 0.035 * b).toFixed(4)})`; });
    ticks.forEach((el, i) => { const d = t - lands[i]; el.style.transform = `scale(${(1 + (d >= 0 ? 0.28 * Math.exp(-d * 8) : 0)).toFixed(3)})`; });
    art.style.translate = `0 ${(10 * Math.sin(t * 2.2)).toFixed(1)}px`;
    // The decorative drawings float, and the list of reasons bounces on every beat once it is complete.
    decos.forEach((d, i) => { d.style.translate = `0 ${(16 * Math.sin(t * 2.2 + i)).toFixed(1)}px`; });
    const listKick = t >= lands[2] + BEAT - 0.01 ? b : 0;
    points.forEach((p, i) => { p.style.translate = `0 ${(-14 * listKick * (i % 2 ? -1 : 1)).toFixed(1)}px`; });
    // sweep: one band of light crosses the product just before the price lands.
    const sw = (t - 2.15) / 0.9;
    artShine.setAttribute("opacity", sw > 0 && sw < 1 ? 1 : 0);
    artShine.setAttribute("x", (-260 + 1000 * eo(clamp(sw))).toFixed(1));
    // count: the rating climbs to its value with one decimal.
    score.textContent = (S.rating * eo(clamp((t - 7.4) / 1.0))).toFixed(1);
    // karaoke: the review lights word by word.
    quoteWords.forEach((w, i) => {
      w.classList.toggle("on", t >= quoteAt(i) && t < quoteAt(i + 1));
      w.classList.toggle("past", t >= quoteAt(i + 1));
    });
    // ring: the week empties down to the days that are left.
    const r = eio(clamp((t - 10.3) / 1.5));
    const left = 7 - (7 - S.daysLeft) * r;
    arc.setAttribute("stroke-dashoffset", (RING * (1 - left / 7)).toFixed(2));
    days.textContent = Math.round(left);
  });
  // Fit long words to the safe area: the hook's longest word, the price and the shop name shrink until they fit.
  window.__ready = document.fonts.ready.then(() => {
    const hook = document.getElementById("hook");
    for (let size = 170; size >= 80; size -= 4) {
      hook.style.fontSize = `${size}px`;
      if (Math.max(...hookWords.map((w) => w.offsetWidth)) <= 660 && hook.offsetHeight <= 700) break;
    }
    const price = document.querySelector(".price");
    for (let size = 118; size > 60 && price.offsetWidth > 730; size -= 4) price.style.fontSize = `${size}px`;
    const names = [...document.querySelectorAll(".shop")];
    for (let size = 150; size > 70 && Math.max(...names.map((n) => n.offsetWidth)) > 760; size -= 4) names.forEach((n) => { n.style.fontSize = `${size}px`; });
    names[1].style.top = `${330 + names[0].offsetHeight}px`;
  });
})();
</script>
<script src="../video/engine.js"></script>
</body>
</html>
