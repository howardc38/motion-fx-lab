<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Film effects studio</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        background: #0c151b;
        color: #ebeee7;
        font: 15px system-ui;
      }
      main {
        max-width: 1280px;
        margin: auto;
      }
      #frame {
        width: 100%;
        aspect-ratio: 16/9;
      }
      #frame canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      nav {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        padding: 16px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 8px 18px;
        cursor: pointer;
      }
      a {
        color: #efba81;
      }
      input[type="checkbox"] {width:auto;}
      input[type="range"] {
        width: 300px;
        max-width: 60vw;
      }
      #error {
        color: #fca68b;
      }
      body.record nav,
      body.record h1 {
        display: none;
      }
      body.record main,
      body.record #frame {
        width: 1280px;
        height: 720px;
      }
      h1 {
        font-size: 22px;
        padding: 0 16px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script src="../fx/studio-effects.js"></script>
  </head>
  <body>
    <main>
      <h1>Film effects studio</h1>
      <nav>
        <a href="../index.html">Gallery</a
        ><select id="effect" aria-label="Effect"></select
        ><select id="theme" aria-label="Art direction" hidden></select><label id="compare-control" hidden><input type="checkbox" id="compare"> Input / effect comparison</label>
      </nav>
      <div id="frame"></div>
      <nav>
        <button id="play">Play</button
        ><label
          >Time
          <input
            id="seek"
            type="range"
            min="0"
            max="6"
            step="0.033333"
            value="0" /></label
        ><output id="clock">0.00 s</output>
      </nav>
      <p id="description"></p>
      <p id="error" role="alert"></p>
    </main>
    <script>
      const effects = new Map();
      const compare=document.getElementById("compare");compare.checked=new URLSearchParams(location.search).get("compare")==="1";
      let current,
        id,
        clock = 0,
        playing = false,
        last = 0,
        token = 0,
        busy = false,
        renderedKey = "";
      const selector = document.getElementById("effect"),
        theme = document.getElementById("theme"),
        seek = document.getElementById("seek");
      for (const s of FXStudio.studies) {
        const o = document.createElement("option");
        o.value = s.id;
        o.textContent = s.name;
        selector.appendChild(o);
      }
      let themes = [];
      import("../fx/studio/themes.js").then((m) => {
        themes = m.themes;
        themes.forEach((s) => {
          const o = document.createElement("option");
          o.value = s.id;
          o.textContent = s.name;
          theme.appendChild(o);
        });
      });
      async function draw() {
        if (!current || busy) return;
        busy = true;
        const request = token, time = clock;
        try {
          await current.frame(
            time,
            id === "themes" ? { theme: Number(theme.value) } : {},
          );
          if (request !== token || time !== clock) return;
          seek.value = time;
          document.getElementById("clock").textContent =
            time.toFixed(2) + " s";
        } catch (e) {
          playing = false;
          document.getElementById("error").textContent = e.message;
        } finally {
          busy = false;
        }
      }
      async function select(value) {
        const request = ++token;
        current = null;
        id = value;
        selector.value = id;
        clock = 0;
        playing = false;
        renderedKey = "";
        document.getElementById("play").textContent = "Play";
        const s = FXStudio.studies.find((s) => s.id === id);
        const comparing=compare.checked&&!!FXStudio.previews[id];
        seek.max = s.period;
        document.getElementById("compare-control").hidden=!FXStudio.previews[id];
        theme.hidden = id !== "themes";
        document.getElementById("description").textContent = comparing ? FXStudio.previews[id].watch+" "+FXStudio.previews[id].note : s.purpose;
        document.getElementById("error").textContent = "";
        try {
          const key=id+(comparing?":comparison":":effect");
          if (!effects.has(key)) effects.set(key, comparing?FXStudio.preview(id):FXStudio.create(id));
          const e = await effects.get(key);
          if (request !== token) return;
          current = e;
          document.getElementById("frame").replaceChildren(e.canvas);
          await draw();
          if (request !== token) return;
          const url=new URL(location.href);url.hash=id;if(comparing)url.searchParams.set("compare","1");else url.searchParams.delete("compare");
          history.replaceState(null, "", url);
        } catch (e) {
          document.getElementById("error").textContent = e.message;
        }
      }
      compare.onchange=()=>select(selector.value);
      selector.onchange = () => select(selector.value);
      theme.onchange = () => { renderedKey = ""; };
      seek.oninput = () => {
        playing = false;
        clock = Number(seek.value);
        document.getElementById("play").textContent = "Play";
      };
      document.getElementById("play").onclick = () => {
        playing = !playing;
        document.getElementById("play").textContent = playing
          ? "Pause"
          : "Play";
      };
      async function loop(now) {
        if (last && playing && current) {
          clock =
            (clock + Math.min((now - last) / 1000, 0.1)) %
            FXStudio.studies.find((s) => s.id === id).period;
        }
        const key = token + ':' + id + ':' + clock + ':' + theme.value;
        if (current && !busy && key !== renderedKey) { await draw(); renderedKey = key; }
        last = now;
        requestAnimationFrame(loop);
      }
      window.studio = {
        select,
        get current() {
          return current;
        },
        get id() {
          return id;
        },
      };
      select(
        FXStudio.studies.some((s) => s.id === location.hash.slice(1))
          ? location.hash.slice(1)
          : "portal",
      );
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
