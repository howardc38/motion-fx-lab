<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peel. Draw. Dissolve.</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#141110;color:#f6f1e6;font:13px "Archivo","Helvetica Neue",Arial,sans-serif}
main{width:min(100vw,1600px);margin:auto;position:relative}
#stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#f5f2ea}
#film{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:28px 38px}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:16px}
.pill{background:rgba(16,15,18,0.76);backdrop-filter:blur(8px);color:#f8f5ef;padding:7px 16px;border-radius:999px;font:700 12px/1.2 "JetBrains Mono",monospace;letter-spacing:0.06em;border:1px solid rgba(255,255,255,0.16);font-variant-numeric:tabular-nums}
nav{padding:14px 18px;display:flex;align-items:center;gap:12px;background:#1d1917;border-top:1px solid #352d28;flex-wrap:wrap}
button,input[type="text"]{padding:8px 13px;border:1px solid #524640;background:#100e0d;color:#f6f1e6;font:inherit;border-radius:4px}
button{cursor:pointer;font-weight:700}
#scrub{flex:1;min-width:180px;accent-color:#f2542d}
#time{font-variant-numeric:tabular-nums;min-width:92px;color:#c2b7ad}
body.record main{width:1920px;margin:0}
body.record nav{display:none}
body.record #stage,body.record #film{width:1920px;height:1080px}
</style>
</head>
<body data-film="tactile-craft">
<main>
  <div id="stage">
    <canvas id="film" width="1920" height="1080"></canvas>
    <div id="hud">
      <div class="hud-row">
        <span class="pill" id="hudAct">ACT 01 · VECTOR BÉZIER CONSTRUCTION</span>
        <span class="pill">TACTILE CANVAS 2D · 60 FPS</span>
      </div>
      <div class="hud-row">
        <span class="pill" id="hudEffect">vector-bezier-draw</span>
        <span class="pill" id="hudFrame">F 0000 / 0720</span>
      </div>
    </div>
  </div>
  <nav>
    <button id="play" type="button">Play</button>
    <input id="scrub" aria-label="Timeline" type="range" min="0" max="12" step="0.01" value="0">
    <span id="time">0.00 / 12.00</span>
    <label>Word (?text=) <input id="customText" type="text" placeholder="CRAFT" size="16"></label>
  </nav>
</main>
<script type="module">
import { create as createEd } from "../fx/editorial-data/index.js";
import { create as createTactile } from "../fx/tactile/index.js";
import { create as createSpatial } from "../fx/spatial/index.js";

const W = 1920, H = 1080, D = 12.0;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };

const canvas = document.getElementById("film");
const g = canvas.getContext("2d");
const hud = document.getElementById("hud");
const hudAct = document.getElementById("hudAct");
const hudEffect = document.getElementById("hudEffect");
const hudFrame = document.getElementById("hudFrame");
const scrub = document.getElementById("scrub");
const timeEl = document.getElementById("time");
const playBtn = document.getElementById("play");
const customInput = document.getElementById("customText");

const params = new URLSearchParams(location.search);
let customOverride = params.get("text") || "";
if (customOverride) customInput.value = customOverride;

let vecDraw, peel, canopy, dissolve;
let record = false, playing = false, at = 0, startWall = 0;

function fadeBlend(a, b, k) {
  g.clearRect(0, 0, W, H);
  g.globalAlpha = 1;
  g.drawImage(a, 0, 0, W, H);
  g.globalAlpha = k;
  g.drawImage(b, 0, 0, W, H);
  g.globalAlpha = 1;
}

async function render(rawT) {
  const t = clamp(rawT, 0, D);
  const label = customOverride.trim();

  // Act 1 (0.0 - 3.6s): Vector Bézier pen & width-tool construction
  // Act 2 (3.6 - 6.6s): Curled sticker peel transition
  // Act 3 (6.6 - 9.2s): Botanical canopy parting & bokeh reveal
  // Act 4 (9.2 - 12.0s): Energy-preserving particle dissolve
  if (t < 3.4) {
    vecDraw.frame((t / 3.6) * 5.1, { text: label || "PAPERWING" });
    g.drawImage(vecDraw.canvas, 0, 0, W, H);
    hudAct.textContent = "ACT 01 · VECTOR BÉZIER CONSTRUCTION";
    hudEffect.textContent = "id: vector-bezier-draw";
  } else if (t < 3.8) {
    vecDraw.frame((t / 3.6) * 5.1, { text: label || "PAPERWING" });
    peel.frame((t - 3.4) * 1.15 + 0.35, { text: label || "PEEL BACK" });
    fadeBlend(vecDraw.canvas, peel.canvas, smooth(3.4, 3.8, t));
    hudAct.textContent = "ACT 02 · CURLED STICKER PEEL";
    hudEffect.textContent = "id: sticker-peel";
  } else if (t < 6.4) {
    peel.frame((t - 3.4) * 1.05 + 0.35, { text: label || "PEEL BACK" });
    g.drawImage(peel.canvas, 0, 0, W, H);
    hudAct.textContent = "ACT 02 · CURLED STICKER PEEL";
    hudEffect.textContent = "id: sticker-peel";
  } else if (t < 6.8) {
    peel.frame((t - 3.4) * 1.05 + 0.35, { text: label || "PEEL BACK" });
    canopy.frame((t - 6.4) * 1.2 + 0.55, { text: label || "SOLSTICE" });
    fadeBlend(peel.canvas, canopy.canvas, smooth(6.4, 6.8, t));
    hudAct.textContent = "ACT 03 · BOTANICAL CANOPY PARTING";
    hudEffect.textContent = "id: canopy-part-title";
  } else if (t < 9.0) {
    canopy.frame((t - 6.4) * 1.2 + 0.55, { text: label || "SOLSTICE" });
    g.drawImage(canopy.canvas, 0, 0, W, H);
    hudAct.textContent = "ACT 03 · BOTANICAL CANOPY PARTING";
    hudEffect.textContent = "id: canopy-part-title";
  } else if (t < 9.4) {
    canopy.frame((t - 6.4) * 1.2 + 0.55, { text: label || "SOLSTICE" });
    dissolve.frame((t - 9.0) * 1.15 + 0.4, { text: label || "DISPERSE" });
    fadeBlend(canopy.canvas, dissolve.canvas, smooth(9.0, 9.4, t));
    hudAct.textContent = "ACT 04 · ENERGY-PRESERVING DISSOLVE";
    hudEffect.textContent = "id: particle-dissolve";
  } else {
    dissolve.frame((t - 9.0) * 1.15 + 0.4, { text: label || "DISPERSE" });
    g.drawImage(dissolve.canvas, 0, 0, W, H);
    hudAct.textContent = "ACT 04 · ENERGY-PRESERVING DISSOLVE";
    hudEffect.textContent = "id: particle-dissolve";
  }

  const hudAlpha = smooth(0.15, 0.45, t) * (1 - smooth(11.45, 11.9, t));
  hud.style.opacity = hudAlpha.toFixed(3);
  hudFrame.textContent = `F ${String(Math.round(t * 60)).padStart(4, "0")} / 0720`;
  if (!record) {
    scrub.value = t;
    timeEl.textContent = `${t.toFixed(2)} / ${D.toFixed(2)}`;
  }
}

window.__SIZE = { w: W, h: H };
window.__DUR = D;
window.__FPS = 60;
window.__poster = 4.65;
window.__preview = [[1.5, 3.1], [4.5, 6.0], [7.5, 8.8], [9.8, 11.2]];
window.__music = [[0, "intro"], [2.4, "drop"], [6.6, "lift"], [9.2, "final"], [10.8, "tail"]];
window.__cues = () => [
  { t: 0.25, name: "tick", gain: 0.7 },
  { t: 1.45, name: "tap", gain: 0.72 },
  { t: 2.4, name: "chime", gain: 0.78 },
  { t: 3.65, name: "whoosh", gain: 0.8 },
  { t: 4.85, name: "pop", gain: 0.74 },
  { t: 6.65, name: "whoosh", gain: 0.75 },
  { t: 7.7, name: "ping", gain: 0.72 },
  { t: 9.2, name: "impact", gain: 0.7 },
  { t: 10.4, name: "send", gain: 0.68 },
  { t: 11.3, name: "ding", gain: 0.64 },
];

window.__ready = (async () => {
  [vecDraw, peel, canopy, dissolve] = await Promise.all([
    createEd("vector-bezier-draw", { width: W, height: H }),
    createTactile("sticker-peel", { width: W, height: H }),
    createSpatial("canopy-part-title", { width: W, height: H }),
    createTactile("particle-dissolve", { width: W, height: H }),
  ]);
  await document.fonts.ready;
  await render(0);
})();

window.__render = async (t) => { await window.__ready; await render(t); };
window.__record = async () => { record = true; playing = false; document.body.classList.add("record"); };

playBtn.onclick = () => {
  playing = !playing;
  if (at >= D) at = 0;
  startWall = performance.now() - at * 1000;
  playBtn.textContent = playing ? "Pause" : "Play";
};
scrub.oninput = () => { playing = false; playBtn.textContent = "Play"; at = +scrub.value; window.__render(at); };
customInput.oninput = () => { customOverride = customInput.value; window.__render(at); };

let busy = false;
function loop(now) {
  if (playing && !record && !busy) {
    busy = true;
    at = (now - startWall) / 1000;
    if (at >= D) { at = at % D; startWall = now - at * 1000; }
    window.__render(at).finally(() => { busy = false; });
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
