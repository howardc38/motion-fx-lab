<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Same fight. Eight treatments.</title><link rel="icon" href="data:,"><style>body{margin:0;background:#102638;color:#eee7d5;font:16px system-ui}main{max-width:1280px;margin:auto}canvas{display:block;width:100%;aspect-ratio:16/9}nav{display:flex;gap:16px;padding:16px;align-items:center}input{flex:1}a{color:#efb795}body.record nav{display:none}body.record main{width:1280px;height:720px;max-width:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script src="../fx/studio-effects.js"></script></head><body><main><canvas id="film" width="1280" height="720"></canvas><nav><a href="../index.html">Gallery</a><button id="play">Play</button><input id="seek" type="range" min="0" max="24" step=".033333" aria-label="Film time"><output id="clock">0.00 s</output></nav></main><script>
const treatments=[['video-dots','Footage halftone dots'],['freeze-orbit','Frozen action. Moving camera.'],['echo','Colored temporal echoes'],['particle-lens','Particle rush + depth of field'],['dot-impact','Impact + recovery'],['time-remap','Control the source clock'],['depth-dots','2.5D image relief'],['skin-cloud','Animated skeletal points']];
const canvas=document.getElementById('film'),g=canvas.getContext('2d',{willReadFrequently:true});
// Static headings are rasterized once. Repainting text over different preceding
// GPU frames otherwise introduces small cold/warm glyph-edge color differences.
const headers=treatments.map(([,title],i)=>{const c=document.createElement('canvas');c.width=1280;c.height=96;const h=c.getContext('2d',{willReadFrequently:true});h.fillStyle='#102638';h.fillRect(0,0,1280,96);h.fillStyle='#f2ead6';h.font='900 31px Arial';h.fillText(title,32,51);h.font='14px Arial';h.fillText('SAME FIGHT / EIGHT TREATMENTS',33,77);h.textAlign='right';h.font='900 30px Arial';h.fillText((i+1)+' / 8',1248,57);return c;});
window.__SIZE={w:1280,h:720};window.__DUR=24;window.__music=[[0,'build'],[2.4,'drop'],[12,'break'],[14.4,'final'],[21.6,'tail']];window.__poster=4.2;window.__gif=[[.6,1.3],[3.6,4.3],[6.5,7.2],[10,10.7],[12.5,13.2],[18.5,19.2],[21.5,22.2]];window.__cues=()=>[3,6,9,12,15,18,21].map(t=>({t,name:'whoosh',gain:.5}));
let effects,playing=false,recording=false,time=0,last=0,pending=Promise.resolve();window.__ready=Promise.all(treatments.map(([id])=>FXStudio.create(id))).then(e=>effects=e);
window.__render=async t=>{await __ready;const i=Math.min(7,Math.floor(Math.max(0,t)/3)),local=Math.max(0,t-i*3),[id,title]=treatments[i];let source=local*(id==='freeze-orbit'||id==='particle-lens'?2:1.6),options={};if(id==='time-remap'){if(local<.8){source=local*2;options.timeMode='normal';}else if(local<1.4){source=2.8;options.timeMode='ramp';}else if(local<2.2){source=(local-1.4)*3;options.timeMode='reverse';}else{source=(local-2.2)*4;options.timeMode='steps';}}await effects[i].frame(source,options);g.drawImage(effects[i].canvas,0,0);g.drawImage(headers[i],0,0);document.getElementById('seek').value=t;document.getElementById('clock').textContent=t.toFixed(2)+' s';};
const render=t=>{const work=pending.then(()=>__render(t));pending=work.catch(()=>{});return work;};window.__record=async()=>{recording=true;playing=false;await pending;await __ready;document.body.classList.add('record');};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';};document.getElementById('seek').oninput=e=>{playing=false;time=+e.target.value;render(time);};async function loop(now){if(recording)return;if(playing){time=(time+Math.min(.1,(now-last)/1000))%24;await render(time);}last=now;requestAnimationFrame(loop);}__ready.then(()=>recording?undefined:render(0)).then(()=>{if(!recording)requestAnimationFrame(loop)});
</script></body></html>
