<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Same fight. Eight treatments.</title><link rel="icon" href="data:,"><style>body{margin:0;background:#102638;color:#eee7d5;font:16px system-ui}main{max-width:1280px;margin:auto}canvas{display:block;width:100%;aspect-ratio:16/9}nav{display:flex;gap:16px;padding:16px;align-items:center}input{flex:1}a{color:#efb795}body.record nav{display:none}body.record main{width:1280px;height:720px;max-width:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script src="../fx/studio-effects.js"></script></head><body><main><canvas id="film" width="1280" height="720"></canvas><nav><a href="../index.html">Gallery</a><button id="play">Play</button><input id="seek" type="range" min="0" max="24" step=".033333" aria-label="Film time"><output id="clock">0.00 s</output></nav></main><script>
const treatments=['video-dots','freeze-orbit','echo','particle-lens','dot-impact','time-remap','depth-dots','skin-cloud'];
const CHAPTER=4.8,canvas=document.getElementById('film'),g=canvas.getContext('2d',{willReadFrequently:true});
window.__SIZE={w:1280,h:720};window.__DUR=CHAPTER*treatments.length;window.__music=[[0,'build'],[4.8,'drop'],[19.2,'break'],[24,'lift'],[33.6,'final'],[36,'tail']];window.__poster=6.4;
window.__gif=[[.5,1.4],[5.8,7.2],[10.5,11.5],[16.2,17.5],[20.4,21.5],[25.8,27.4],[29.8,31.2],[34.2,35.4]];
window.__cues=()=>treatments.slice(1).map((_,i)=>({t:(i+1)*CHAPTER,name:'whoosh',gain:.45}));
let effects,playing=false,recording=false,time=0,last=0,pending=Promise.resolve();
window.__ready=Promise.all(treatments.map(id=>FXStudio.preview(id))).then(e=>effects=e);
window.__render=async t=>{await __ready;t=Math.max(0,Math.min(__DUR,t));const i=Math.min(treatments.length-1,Math.floor(t/CHAPTER)),local=t-i*CHAPTER,id=treatments[i];let source=local,options={};if(id==='freeze-orbit'||id==='depth-dots')source=local/CHAPTER*6;if(id==='particle-lens')source=2.4+local/CHAPTER*2.4;if(id==='time-remap'){source=local+4.8;options.timeMode='ramp';}await effects[i].frame(source,options);g.drawImage(effects[i].canvas,0,0);g.fillStyle='#b6cccb';g.font='18px Arial';g.textAlign='right';g.fillText((i+1)+' / 8',1238,58);g.textAlign='left';document.getElementById('seek').value=t;document.getElementById('clock').textContent=t.toFixed(2)+' s';window.comparisonProof={chapter:id,...effects[i].proof()};};
const render=t=>{const work=pending.then(()=>__render(t));pending=work.catch(()=>{});return work;};window.__record=async()=>{recording=true;playing=false;await pending;await __ready;document.body.classList.add('record');};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';};document.getElementById('seek').max=__DUR;document.getElementById('seek').oninput=e=>{playing=false;document.getElementById('play').textContent='Play';time=+e.target.value;render(time);};async function loop(now){if(recording)return;if(playing){time=(time+Math.min(.1,(now-last)/1000))%__DUR;await render(time);}last=now;requestAnimationFrame(loop);}__ready.then(()=>recording?undefined:render(0)).then(()=>{if(!recording)requestAnimationFrame(loop)});
</script></body></html>
