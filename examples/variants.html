<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion FX Lab example: one template, many rows of data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root { --ink: #0e0d12; --paper: #f4f3ee; --pink: #ff90e8; --sun: #ffd400; --blue: #3b5bff; --muted: #8f8a9c;
    --lat: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: #111110; display: grid; place-items: center; }
  #frame { position: relative; overflow: hidden; background: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; font-family: var(--lat); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.record { display: block; }
  body.record #frame { position: fixed; left: 0; top: 0; }
  body.record #stage { transform: none !important; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; background: var(--ink); }
  .edge { position: absolute; top: 0; bottom: 0; width: 26px; margin-left: -1px; background: var(--pink); opacity: 0; }
  .a { position: absolute; }
  .head { left: 150px; top: 70px; font: 700 26px var(--mono); letter-spacing: .1em; color: var(--muted); }
  .code { left: 150px; top: 118px; font: 700 34px var(--mono); color: var(--paper); }
  .card { top: 250px; width: 500px; height: 620px; border-radius: 30px; background: #fff; overflow: hidden; }
  .card .top { height: 400px; padding: 40px; box-sizing: border-box; position: relative; }
  .card .name { font: 900 76px/.95 var(--lat); font-stretch: 112%; letter-spacing: -.02em; }
  .card .tag { position: absolute; left: 40px; bottom: 34px; font: 900 32px var(--lat); padding: 12px 22px; border-radius: 14px; background: #fff; color: var(--ink); border: 4px solid var(--ink); }
  .card .bot { padding: 34px 40px; display: flex; flex-direction: column; gap: 22px; }
  .card .price { font: 900 110px/1 var(--lat); font-variant-numeric: tabular-nums; }
  .card .price small { font-size: 44px; margin-right: 8px; }
  .card .meter { display: flex; align-items: center; gap: 16px; font: 700 22px var(--mono); color: #5c5868; }
  .card .meter span { flex: 1; height: 16px; border-radius: 8px; background: #ebe9e2; overflow: hidden; }
  .card .meter i { display: block; height: 100%; border-radius: 8px; background: var(--ink); transform-origin: left center; }
  .card .row { position: absolute; right: 34px; bottom: 44px; font: 700 22px var(--mono); opacity: .7; }
</style>
</head>
<body>
<div id="frame">
<div id="stage" data-w="1920" data-h="1080" data-dur="9.6"></div>
</div>
<script>
(() => {
  // The data: one row per video card. Add a row and render again.
  const rows = [
    { name: "Brown Sugar", price: 32, tag: "Best seller", sweet: 4, color: "#c8773a" },
    { name: "Jasmine Green", price: 26, tag: "Less sugar", sweet: 2, color: "#5fbf6a" },
    { name: "Oolong Milk", price: 30, tag: "Classic", sweet: 3, color: "#3b5bff" },
    { name: "Lychee Oolong", price: 34, tag: "New", sweet: 3, color: "#ff90e8" },
    { name: "Taro Latte", price: 33, tag: "Creamy", sweet: 4, color: "#9b7bd4" },
    { name: "Mango Green", price: 31, tag: "Summer", sweet: 3, color: "#ffd400" },
  ];

  // The template: one row in, one animated card out. Every card runs the same timing.
  const light = (hex) => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return 0.2126 * r + 0.7152 * g + 0.0722 * b > 150; };
  const card = (row, i, n) => `
    <div class="a card" style="left:${150 + i * 560}px" data-fx="up" data-at="${0.5 + i * 0.12}" data-sfx="pop">
      <div class="top" style="background:${row.color};color:${light(row.color) ? "#0e0d12" : "#fff"}">
        <div class="row">row ${n}</div>
        <div class="name" data-fx="left" data-at="${0.7 + i * 0.12}">${row.name.replace(" ", "<br>")}</div>
        <div class="tag" data-fx="pop" data-at="${1.3 + i * 0.12}" data-sfx="tick">${row.tag}</div>
      </div>
      <div class="bot">
        <div class="price"><small>HK$</small><span data-fx="count" data-to="${row.price}" data-at="${0.9 + i * 0.12}" data-dur="0.9">0</span></div>
        <div class="meter">SWEET<span><i style="width:${row.sweet * 20}%" data-fx="grow" data-at="${1.4 + i * 0.12}" data-dur="0.5"></i></span>${row.sweet}/5</div>
      </div>
    </div>`;

  const scene = (start, from) => `
    <section class="scene" data-start="${start}">
      <div class="edge"></div>
      <div class="a head" data-fx="fade" data-at="0.1">ONE TEMPLATE · ROWS ${from + 1}–${from + 3} OF ${rows.length} · SAMPLE DATA, FICTIONAL SHOP</div>
      <div class="a code" data-fx="type" data-at="0.2" data-dur="0.6" data-sfx="type">rows.slice(${from}, ${from + 3}).map(card)</div>
      ${rows.slice(from, from + 3).map((r, i) => card(r, i, from + i + 1)).join("")}
    </section>`;

  document.getElementById("stage").innerHTML = scene(0, 0) + scene(4.8, 3);
  window.__poster = 3.5;   // the poster frame, in seconds
  window.__music = [[0, "intro"], [2.4, "build"], [4.8, "drop"], [7.2, "tail"]];
  window.__ready = document.fonts.ready;
})();
</script>
<script src="../video/engine.js"></script>
</body>
</html>
